    let isSessionActive = false;
    let inMemoryVaultKey = null;

    const loginScreen = document.getElementById('page-login-screen');
    const dashboardScreen = document.getElementById('page-admin-dashboard');
    const loginForm = document.getElementById('page-login-form');
    const loginErrorBadge = document.getElementById('login-error-badge');
    const passInput = document.getElementById('input-admin-pass');
    const togglePassBtn = document.getElementById('btn-toggle-pass');

    // Password visibility toggle
    if (togglePassBtn && passInput) {
      togglePassBtn.onclick = () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          togglePassBtn.textContent = '🔒';
        } else {
          passInput.type = 'password';
          togglePassBtn.textContent = '👁️';
        }
      };
    }

    // ─── MUTATION OBSERVER SENTRY (PREVENTS CONSOLE DOM BYPASS) ─
    const sentryObserver = new MutationObserver(() => {
      if (!isSessionActive) {
        if (!dashboardScreen.classList.contains('hidden')) {
          dashboardScreen.classList.add('hidden');
          dashboardScreen.innerHTML = '';
        }
      }
    });
    sentryObserver.observe(dashboardScreen, { attributes: true, childList: true });

    // ─── CRYPTO ENGINE ─────────────────────────────────────────
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function decryptAesGcm(keyBuffer, base64Payload) {
      const raw = Uint8Array.from(atob(base64Payload), c => c.charCodeAt(0));
      const iv = raw.subarray(0, 12);
      const ctWithTag = raw.subarray(12);

      const cryptoKey = await crypto.subtle.importKey(
        'raw',
        keyBuffer,
        { name: 'AES-GCM' },
        false,
        ['decrypt']
      );

      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        cryptoKey,
        ctWithTag
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    async function attemptUnlockVault(password) {
      try {
        const rawPassKey = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password.toLowerCase() + PEPPER));
        const masterKeyBase64 = await decryptAesGcm(rawPassKey, KEY_SLOT);
        if (!masterKeyBase64 || masterKeyBase64.length !== 44) return null;

        const rawMasterKey = Uint8Array.from(atob(masterKeyBase64), c => c.charCodeAt(0));
        const decryptedHtml = await decryptAesGcm(rawMasterKey, VAULT_CIPHERTEXT);

        return {
          masterKeyBase64,
          html: decryptedHtml
        };
      } catch (e) {
        return null;
      }
    }

    // ─── SESSION SIGNATURE ENGINE ──────────────────────────────
    async function createSignedSessionToken(masterKeyBase64) {
      const timestamp = Date.now();
      const payload = btoa(JSON.stringify({ k: masterKeyBase64, t: timestamp }));
      const sig = await sha256(payload + PEPPER);
      return payload + '.' + sig;
    }

    async function verifySignedSessionToken(token) {
      if (!token || !token.includes('.')) return null;
      const [payload, sig] = token.split('.');
      const expectedSig = await sha256(payload + PEPPER);
      if (sig !== expectedSig) return null;

      try {
        const data = JSON.parse(atob(payload));
        if (Date.now() - data.t > 24 * 60 * 60 * 1000) return null;
        return data.k;
      } catch (e) {
        return null;
      }
    }

    // ─── INACTIVITY AUTO-LOGOUT (30 MINUTES) ───────────────────
    let inactivityTimer = null;
    function resetInactivity() {
      if (inactivityTimer) clearTimeout(inactivityTimer);
      if (isSessionActive) {
        inactivityTimer = setTimeout(() => {
          alert('🔒 Session closed after 30m idle.');
          terminateSession();
        }, 30 * 60 * 1000);
      }
    }
    ['mousedown', 'keydown', 'scroll', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetInactivity, { passive: true });
    });

    // ─── ACTIVATE & INJECT DASHBOARD ───────────────────────────
    async function activateDashboard(decryptedHtml, masterKeyBase64) {
      isSessionActive = true;
      inMemoryVaultKey = masterKeyBase64;

      if (loginErrorBadge) loginErrorBadge.classList.add('hidden');

      const sessionToken = await createSignedSessionToken(masterKeyBase64);
      sessionStorage.setItem('ag_session_vault', sessionToken);
      localStorage.removeItem('ag_failed_attempts');
      localStorage.removeItem('ag_lock_until');

      dashboardScreen.innerHTML = decryptedHtml;
      loginScreen.classList.add('hidden');
      dashboardScreen.classList.remove('hidden');

      const logoutBtn = document.getElementById('page-btn-logout');
      if (logoutBtn) {
        logoutBtn.onclick = (e) => {
          e.preventDefault();
          terminateSession();
        };
      }

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
      fetchStats();
      resetInactivity();
    }

    function terminateSession() {
      isSessionActive = false;
      inMemoryVaultKey = null;
      sessionStorage.removeItem('ag_session_vault');

      dashboardScreen.classList.add('hidden');
      dashboardScreen.innerHTML = '';
      loginScreen.classList.remove('hidden');

      const passEl = document.getElementById('input-admin-pass');
      if (passEl) passEl.value = '';
    }

    // ─── INITIALIZE EXISTING SESSION ON RELOAD ─────────────────
    async function tryRestoreSession() {
      const savedToken = sessionStorage.getItem('ag_session_vault');
      if (!savedToken) return;

      const masterKeyBase64 = await verifySignedSessionToken(savedToken);
      if (!masterKeyBase64) {
        sessionStorage.removeItem('ag_session_vault');
        return;
      }

      try {
        const rawMasterKey = Uint8Array.from(atob(masterKeyBase64), c => c.charCodeAt(0));
        const decryptedHtml = await decryptAesGcm(rawMasterKey, VAULT_CIPHERTEXT);
        if (decryptedHtml) {
          await activateDashboard(decryptedHtml, masterKeyBase64);
        }
      } catch (e) {
        sessionStorage.removeItem('ag_session_vault');
      }
    }

    // ─── LOGIN SUBMIT HANDLER ──────────────────────────────────
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const emailEl = document.getElementById('input-admin-email');
        const passEl = document.getElementById('input-admin-pass');
        const submitBtn = document.getElementById('btn-login-submit');

        if (!emailEl || !passEl) return;
        const idVal = emailEl.value.trim().toLowerCase();
        const passVal = passEl.value.trim().toLowerCase();

        if (loginErrorBadge) loginErrorBadge.classList.add('hidden');

        // Verify ID
        if (idVal !== MASTER_ID) {
          if (loginErrorBadge) {
            loginErrorBadge.textContent = '❌ Invalid Admin ID';
            loginErrorBadge.classList.remove('hidden');
          }
          return;
        }

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>Verifying Cryptographic Credentials...</span>';
        }

        try {
          const unlockResult = await attemptUnlockVault(passVal);
          if (unlockResult && unlockResult.html) {
            await activateDashboard(unlockResult.html, unlockResult.masterKeyBase64);
            return;
          } else {
            if (loginErrorBadge) {
              loginErrorBadge.textContent = '❌ Invalid Master Password';
              loginErrorBadge.classList.remove('hidden');
            }
          }
        } catch (err) {
          if (loginErrorBadge) {
            loginErrorBadge.textContent = '❌ Decryption error: ' + (err.message || 'Verification failed');
            loginErrorBadge.classList.remove('hidden');
          }
        } finally {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="lock" class="w-4 h-4"></i><span>SIGN IN TO CONTROL CENTER</span>';
            if (window.lucide) window.lucide.createIcons();
          }
        }
      });
    }

    // ─── DASHBOARD METHODS & ACTIONS (BOUND ONLY TO AUTHENTICATED SESSIONS) ──
    const indexTabs = ['dashboard', 'analytics', 'personal', 'media', 'projects', 'skills', 'experience', 'education', 'certificates', 'messages', 'profile', 'settings'];

    window.switchTab = function(tabName) {
      if (!isSessionActive) {
        alert('⛔ ACCESS DENIED: Active cryptographic session required.');
        return;
      }
      if (!tabName) tabName = 'dashboard';
      indexTabs.forEach(t => {
        const btn = document.getElementById('tab-btn-' + t);
        const panel = document.getElementById('panel-' + t);
        if (btn) btn.classList.remove('active');
        if (panel) panel.classList.add('hidden');
      });

      const targetBtn = document.getElementById('tab-btn-' + tabName);
      const targetPanel = document.getElementById('panel-' + tabName);
      if (targetBtn) targetBtn.classList.add('active');
      if (targetPanel) targetPanel.classList.remove('hidden');

      const mainViewport = document.getElementById('admin-main-viewport');
      if (mainViewport) mainViewport.scrollTop = 0;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        try { window.lucide.createIcons(); } catch(e) {}
      }
    };

    window.toggleAdminComingSoonMode = function() {
      if (!isSessionActive) return;
      const isOff = localStorage.getItem('anurag_coming_soon_off') === 'true';
      const btn = document.getElementById('btn-toggle-coming-soon');

        localStorage.removeItem('anurag_coming_soon_off');
        if (btn) {
          btn.textContent = '🟡 COMING SOON ACTIVE';
          btn.className = 'px-4 py-2 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/50 font-bold hover:bg-amber-500/30 transition-colors';
        }
        alert('⏳ Coming Soon Mode ACTIVATED! Visitors will see the Countdown Timer until Tomorrow 12:00 PM IST.');
      } else {
        localStorage.setItem('anurag_coming_soon_off', 'true');
        if (btn) {
          btn.textContent = '🟢 LIVE PORTFOLIO UNLOCKED';
          btn.className = 'px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 font-bold hover:bg-emerald-500/30 transition-colors';
        }
        alert('🟢 LIVE PORTFOLIO UNLOCKED! Visitors can now see full live portfolio immediately.');
      }
    };

    window.changeProjectStatus = async function(num, status) {
      if (!isSessionActive) {
        alert('⛔ ACCESS DENIED: Active cryptographic session required.');
        return;
      }
      const key = 'ag_proj_status_' + num;
      localStorage.setItem(key, status);
      window.dispatchEvent(new Event('storage'));

      const pbadge = document.getElementById('pbadge-' + num);
      if (pbadge) {
        pbadge.textContent = status === 'Completed' ? '🟢 Completed' : '🟡 Coming Soon';
        pbadge.className = status === 'Completed'
          ? 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold'
          : 'px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[10px] font-bold';
      }

      try {
        const cloudUrl = 'https://api.restful-api.dev/objects/ff8081819f7e10ae019fc83569456a67';
        const cRes = await fetch(cloudUrl);
        if (cRes.ok) {
          const cData = await cRes.json();
          const currentData = (cData && cData.data) || {};
          currentData[key] = status;
          await fetch(cloudUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Anurag Portfolio Global Settings',
              data: currentData
            })
          });
        }
      } catch (e) {}

      alert('✓ Project 0' + num + ' status changed to "' + status + '" globally!');
    };

    window.saveProjectDetails = function(num) {
      if (!isSessionActive) return;
      alert('✓ Project 0' + num + ' details saved successfully!');
    };

    window.toggleAddProjectModal = function(show) {
      if (!isSessionActive) return;
      const modal = document.getElementById('modal-add-project');
      if (modal) {
        if (show) modal.classList.remove('hidden');
        else modal.classList.add('hidden');
      }
    };

    window.submitNewProject = function() {
      if (!isSessionActive) return;
      const titleEl = document.getElementById('new-proj-title');
      const statusEl = document.getElementById('new-proj-status');
      if (!titleEl || !titleEl.value.trim()) {
        alert('Please enter a project title.');
        return;
      }
      alert('✓ Project "' + titleEl.value.trim() + '" added with status ' + statusEl.value + '!');
      titleEl.value = '';
      window.toggleAddProjectModal(false);
    };

    async function fetchStats() {
      if (!isSessionActive) return;
      ['01', '02', '03'].forEach(num => {
        const val = localStorage.getItem('ag_proj_status_' + num);
        const pbadge = document.getElementById('pbadge-' + num);
        const select = document.querySelector('select[onchange="changeProjectStatus(\'' + num + '\', this.value)"]');
        if (val) {
          if (select) select.value = val;
          if (pbadge) {
            pbadge.textContent = val === 'Completed' ? '🟢 Completed' : '🟡 Coming Soon';
            pbadge.className = val === 'Completed'
              ? 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold'
              : 'px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-[10px] font-bold';
          }
        }
      });

      renderMessagesTable();
    }

    function renderMessagesTable() {
      const tbody = document.getElementById('admin-messages-table-body');
      if (!tbody) return;

      const localMsgs = JSON.parse(localStorage.getItem('ag_admin_messages') || '[]');
      const defaultMsgs = [
        {
          fullName: 'Senior Technical Recruiter',
          company: 'Fintech Enterprise Labs',
          email: 'recruiter@enterprise-fintech.com',
          subject: 'Summer 2026 Full-Stack AI Engineer Role',
          message: 'Hi Anurag, reviewed your AI Finance Controller and portfolio architecture. We would love to discuss our Summer 2026 engineering internship opportunities with you.',
          createdAt: new Date().toISOString()
        }
      ];

      const allMsgs = [...localMsgs, ...defaultMsgs];
      const sideBadge = document.getElementById('side-msg-badge');
      if (sideBadge) sideBadge.textContent = allMsgs.length;

      tbody.innerHTML = allMsgs.map(m => `
        <tr class="border-b border-cms-border/50 hover:bg-white/[0.02] transition-colors">
          <td class="p-3 font-semibold text-white">${m.fullName || 'Anonymous'}</td>
          <td class="p-3 text-slate-300">${m.company || '—'}</td>
          <td class="p-3 text-cyan-400 font-bold">${m.subject || 'Direct Inquiry'}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold text-[10px]">Received</span></td>
          <td class="p-3 text-right">
            <button onclick="alert('Message from ${m.email}: \\n\\n${(m.message || '').replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 text-[10px] font-bold transition-colors cursor-pointer">View 👁️</button>
          </td>
        </tr>
      `).join('');
    }

    // Initialize on page load
    tryRestoreSession();
  })();
  </script>
</body>
</html>
