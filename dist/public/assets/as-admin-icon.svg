<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Space Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- AS Monogram Glowing Gradient -->
    <linearGradient id="as-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background Container -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>

  <!-- Outer Quantum Ring Glow -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#ring-grad)" stroke-width="6" opacity="0.6" />

  <!-- Ambient Center Glow Orb -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>

  <!-- Orbital Ring Geometry -->
  <ellipse cx="256" cy="256" rx="190" ry="70" fill="none" stroke="url(#as-grad)" stroke-width="3" opacity="0.35" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="190" ry="70" fill="none" stroke="url(#as-grad)" stroke-width="2" stroke-dasharray="8,8" opacity="0.4" transform="rotate(30 256 256)"/>

  <!-- AS Monogram Text -->
  <text x="256" y="325" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="210" font-weight="900" text-anchor="middle" fill="url(#as-grad)" filter="url(#glow)" letter-spacing="-6">AS</text>

  <!-- Admin Crown Badge -->
  <g transform="translate(350, 95) scale(1.4)">
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.9" />
    <path d="M-8,6 L8,6 L10,-8 L3,-1 L0,-10 L-3,-1 L-10,-8 Z" fill="#ffffff"/>
  </g>
</svg>
