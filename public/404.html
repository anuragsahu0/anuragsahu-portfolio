<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Anurag Sahu — Full-Stack Developer Portfolio</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Hack
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1.0).join('/') + '/?p=/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
